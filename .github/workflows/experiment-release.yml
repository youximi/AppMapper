name: CI Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Base version, for example 0.1.0. CI replaces the patch number with its run number. Falls back to Android default versionName."
        required: false
        type: string
      codename:
        description: "Release codename shown in the GitHub Release notes."
        required: false
        default: "Sunday"
        type: string
  push:
    branches:
      - main
      - DEV

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release metadata
        id: metadata
        run: |
          $inputVersion = "${{ inputs.version }}"
          $refName = "${{ github.ref_name }}"
          $refType = "${{ github.ref_type }}"

          # --- Version resolution ---
          if ([string]::IsNullOrWhiteSpace($inputVersion)) {
            if ($refType -eq "tag" -and $refName -match '^v(.+)$') {
              $version = $Matches[1]
            } else {
              $versionLine = Select-String -Path "apps\android\app\build.gradle.kts" -Pattern 'orElse\("([^"]+)"\)' | Select-Object -First 1
              if ($null -eq $versionLine) {
                throw "Unable to infer version. Pass the workflow_dispatch version input."
              }
              $version = $versionLine.Matches[0].Groups[1].Value
            }
          } else {
            $version = $inputVersion.Trim()
            if ($version.StartsWith("v")) {
              $version = $version.Substring(1)
            }
          }

          # --- Codename ---
          $codename = "${{ inputs.codename }}"
          if ([string]::IsNullOrWhiteSpace($codename)) {
            $codename = "Sunday"
          }

          # Keep one workflow so all branches share the same increasing build number.
          $buildNumber = "${{ github.run_number }}"
          $versionParts = $version.Split('.')
          $version = "$($versionParts[0]).$($versionParts[1]).$buildNumber"
          $isMainBranch = ("${{ github.ref }}" -ceq "refs/heads/main")

          if ($isMainBranch) {
            $buildKind = "Release"
            $isPrerelease = "false"
          } else {
            $buildKind = "Experiment_C"
            $isPrerelease = "true"
          }

          $fullVersion = "Version.$version.$buildKind$buildNumber"
          $releaseTag = $fullVersion
          $releaseTitle = if ($isMainBranch) { "AppMapper $version" } else { "AppMapper $version (滚动测试版)" }
          $shortSha = git rev-parse --short HEAD

          # --- Branch detection ---
          $branch = $refName
          if ($refType -eq "tag") {
            $containingBranch = git branch -r --contains HEAD |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -and $_ -notmatch 'HEAD' } |
              Select-Object -First 1

            if (-not [string]::IsNullOrWhiteSpace($containingBranch)) {
              $branch = $containingBranch -replace '^origin/', ''
            }
          }

          # --- Export environment variables ---
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "BUILD_NUMBER=$buildNumber" >> $env:GITHUB_ENV
          "BUILD_KIND=$buildKind" >> $env:GITHUB_ENV
          "FULL_VERSION=$fullVersion" >> $env:GITHUB_ENV
          "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
          "RELEASE_TITLE=$releaseTitle" >> $env:GITHUB_ENV
          "RELEASE_CODENAME=$codename" >> $env:GITHUB_ENV
          "SHORT_SHA=$shortSha" >> $env:GITHUB_ENV
          "SOURCE_BRANCH=$branch" >> $env:GITHUB_ENV
          "IS_PRERELEASE=$isPrerelease" >> $env:GITHUB_ENV

          # --- Step outputs ---
          "app_version=$version" >> $env:GITHUB_OUTPUT
          "is_prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "27"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "16111833"
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          android --no-metrics sdk install "platforms/android-37.2" "build-tools/37.0.0" "platform-tools@37.0.1"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify .NET SDK
        run: |
          $expectedSdk = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
          $actualSdk = dotnet --version
          if ($LASTEXITCODE -ne 0 -or $actualSdk.Trim() -ne $expectedSdk) {
            throw "Expected .NET SDK $expectedSdk, got $actualSdk."
          }

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Check Android signing secrets
        run: |
          $requiredSecrets = @(
            "APPMAPPER_KEYSTORE_BASE64",
            "APPMAPPER_KEYSTORE_PASSWORD",
            "APPMAPPER_KEY_ALIAS",
            "APPMAPPER_KEY_PASSWORD"
          )

          foreach ($secretName in $requiredSecrets) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($secretName))) {
              throw "Missing GitHub secret: $secretName"
            }
          }
        env:
          APPMAPPER_KEYSTORE_BASE64: ${{ secrets.APPMAPPER_KEYSTORE_BASE64 }}
          APPMAPPER_KEYSTORE_PASSWORD: ${{ secrets.APPMAPPER_KEYSTORE_PASSWORD }}
          APPMAPPER_KEY_ALIAS: ${{ secrets.APPMAPPER_KEY_ALIAS }}
          APPMAPPER_KEY_PASSWORD: ${{ secrets.APPMAPPER_KEY_PASSWORD }}

      - name: Decode Android release keystore
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\appmapper-signing" | Out-Null
          $keystorePath = "$env:RUNNER_TEMP\appmapper-signing\appmapper-release.jks"
          [IO.File]::WriteAllBytes($keystorePath, [Convert]::FromBase64String($env:APPMAPPER_KEYSTORE_BASE64))
          "APPMAPPER_KEYSTORE_FILE=$keystorePath" >> $env:GITHUB_ENV
        env:
          APPMAPPER_KEYSTORE_BASE64: ${{ secrets.APPMAPPER_KEYSTORE_BASE64 }}

      - name: Test and build Android release APK
        run: |
          .\apps\android\gradlew.bat -p apps/android :app:test :app:assembleRelease `
            "-PappVersionName=$env:APP_VERSION" `
            "-PappVersionCode=$env:BUILD_NUMBER"
        env:
          APPMAPPER_KEYSTORE_PASSWORD: ${{ secrets.APPMAPPER_KEYSTORE_PASSWORD }}
          APPMAPPER_KEY_ALIAS: ${{ secrets.APPMAPPER_KEY_ALIAS }}
          APPMAPPER_KEY_PASSWORD: ${{ secrets.APPMAPPER_KEY_PASSWORD }}

      - name: Build Windows mapper template
        run: |
          msbuild apps\windows\mapper\AppMapper.Mapper.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64

      - name: Publish Windows controller
        run: |
          dotnet publish apps\windows\controller\AppMapper.Controller.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            "-p:Version=$env:APP_VERSION" `
            "-p:InformationalVersion=$env:FULL_VERSION" `
            -o dist\windows

          Copy-Item apps\windows\mapper\bin\Release\mapper-template.exe dist\windows\

          foreach ($file in @("AppMapper.exe", "AppMapper.dll", "AppMapper.deps.json", "AppMapper.runtimeconfig.json", "mapper-template.exe")) {
            if (!(Test-Path "dist\windows\$file")) {
              throw "Windows publish output is missing $file."
            }
          }

          $runtimeConfig = Get-Content dist\windows\AppMapper.runtimeconfig.json -Raw | ConvertFrom-Json
          if ($runtimeConfig.runtimeOptions.tfm -ne "net11.0") {
            throw "Windows publish output does not target .NET 11."
          }

      - name: Package release assets
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null

          $apk = Get-ChildItem "apps\android\app\build\outputs\apk\release" -Filter "*.apk" |
            Where-Object { $_.Name -notmatch "unsigned" } |
            Select-Object -First 1

          if ($null -eq $apk) {
            throw "Signed release APK not found."
          }

          Copy-Item $apk.FullName "artifacts\appmapper.android.$env:APP_VERSION.apk"
          Compress-Archive -Path "dist\windows\*" -DestinationPath "artifacts\appmapper.windows.$env:APP_VERSION.zip" -Force

      - name: Generate release notes
        run: |
          # Compare stable releases with the previous reachable stable release.
          $tagPattern = if ($env:IS_PRERELEASE -eq "true") {
            '^Version\.\d+\.\d+\.\d+\.(?:Release|Experiment_C)(\d+)$'
          } else {
            '^Version\.\d+\.\d+\.\d+\.Release(\d+)$'
          }
          $previousTag = git for-each-ref `
            --merged=HEAD `
            --format='%(refname:short)' `
            "refs/tags/Version.*" |
            Where-Object { $_ -ne $env:RELEASE_TAG -and $_ -match $tagPattern } |
            Sort-Object { [long]([regex]::Match($_, $tagPattern).Groups[1].Value) } -Descending |
            Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($previousTag)) {
            $changes = "No previous build found."
            $comparison = "Initial build"
          } else {
            $changes = git log "$previousTag..HEAD" --pretty=format:'%h: %s (%an)%n%b'
            if ([string]::IsNullOrWhiteSpace($changes)) {
              $changes = "No commits since $previousTag."
            }

            $previousSha = git rev-parse --short $previousTag
            $compareUrl = "${{ github.server_url }}/${{ github.repository }}/compare/$previousTag...$env:GITHUB_SHA"
            $comparison = "[$previousSha...$env:SHORT_SHA]($compareUrl)"
          }

          $releaseType = if ($env:IS_PRERELEASE -eq "true") { "滚动测试版：极不稳定，仅供测试。" } else { "Release Build" }
          $sourceArchive = "${{ github.server_url }}/${{ github.repository }}/archive/$env:GITHUB_SHA.zip"

          $notes = @(
            $releaseType,
            "",
            "Codename: $env:RELEASE_CODENAME",
            "Version: $env:APP_VERSION",
            "Latest Commit: $env:SHORT_SHA",
            "Branch: $env:SOURCE_BRANCH",
            "",
            "Changes since last build",
            ""
          )

          $notes += $changes -split "`r?`n"
          $notes += ""
          $notes += "Full Comparison: $comparison"
          $notes += ""
          $notes += "Corresponding source: [$env:SHORT_SHA]($sourceArchive)"
          $notes += "Project license: GPL-3.0-only. License texts and third-party notices: Settings > Open-source licenses."

          Set-Content -Path release-notes.md -Value $notes -Encoding UTF8

      # Archive every build in its own Release; Actions artifacts expire.
      # Never replace an existing release/tag or delete older releases.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem artifacts -File | Select-Object -ExpandProperty FullName

          if ($env:IS_PRERELEASE -eq "true") {
            gh release create "$env:RELEASE_TAG" $assets `
              --title "$env:RELEASE_TITLE" `
              --notes-file release-notes.md `
              --prerelease `
              --latest=false `
              --target "$env:GITHUB_SHA"
          } else {
            gh release create "$env:RELEASE_TAG" $assets `
              --title "$env:RELEASE_TITLE" `
              --notes-file release-notes.md `
              --target "$env:GITHUB_SHA"
          }
